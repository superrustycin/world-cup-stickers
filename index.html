    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.2} }

    @keyframes ping { 0% { transform:scale(1); opacity:.7; } 100% { transform:scale(2.2); opacity:0; } }
    .ping { animation: ping 1.5s ease-out infinite; }

    .tap { transition: transform .12s, opacity .12s; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .tap:active { transform: scale(.93); opacity: .8; }

    /* sticker states */
    .s-missing { background:#0d1f3c; color:#1e3a5f; border:1px solid #142540; }
    .s-owned   { background:#14532d; color:#4ade80; border:1px solid #166534; box-shadow:0 2px 8px #16a34a22; }

function LoginScreen({onLogin}) {
  const [email,    setEmail]    = React.useState("");
  const [password, setPassword] = React.useState("");
  const [showPw,   setShowPw]   = React.useState(false);
  const [error,    setError]    = React.useState("");
  const [loading,  setLoading]  = React.useState(false);

  const handleLogin = (e) => {
    e.preventDefault();
    setError(""); setLoading(true);
    setTimeout(()=>{
      const match = Object.values(USERS).find(
        u => u.email.toLowerCase()===email.trim().toLowerCase() && u.password===password
      );
      if (match) { onLogin(match.label); }
      else { setError("Incorrect email or password."); }
      setLoading(false);
    }, 600);
  };

  const fillUser = (key) => {
    setEmail(USERS[key].email);
    setPassword(USERS[key].password);
    setError("");
  };

  return (
    <div style={{height:"100dvh",overflowY:"auto",display:"flex",flexDirection:"column",background:"#08101f"}}>

function StickerBtn({sticker,state,onCycle,highlight}) {
  const isFoil   = sticker.type==="foil";
  const isPhoto  = sticker.type==="photo";
  const isMuseum = sticker.type==="museum";
  let cls = "sticker-btn relative rounded-xl flex flex-col items-center justify-center select-none cursor-pointer ";
  if      (state===1) cls += isFoil?"s-foil-owned":"s-owned";
  else if (state===2) cls += "s-dup";
  else                cls += isFoil?"s-foil-missing":"s-missing";
  const icon = isFoil?"⭐":isPhoto?"📸":isMuseum?"🏆":null;
  return (
    <button onClick={onCycle} className={cls}
      style={{
        height:isFoil||isMuseum?"58px":"50px",
        outline:highlight?"3px solid #FFD700":undefined,
        outlineOffset:highlight?"2px":undefined,
        transform:highlight?"scale(1.08)":undefined,
        zIndex:highlight?10:undefined,
      }}>
      {icon&&<span style={{fontSize:9,lineHeight:1,marginBottom:1}}>{icon}</span>}
      <span className="font-black leading-none" style={{fontSize:sticker.id.length>4?9:11}}>{sticker.id}</span>
      {state===2&&(
        <span className="absolute -top-1.5 -right-1.5 text-white font-black rounded-full flex items-center justify-center"
          style={{width:17,height:17,background:"#ea580c",fontSize:8}}>×2</span>
      )}
    </button>
  );
}

/* ════════════════════════════════════════════════════════════
   EXPORT MODAL
════════════════════════════════════════════════════════════ */
function ExportModal({data,username,onClose}) {
  const [listType, setListType] = React.useState(1);
  const [copied,   setCopied]   = React.useState(false);

  const buildText = React.useCallback((type)=>{
    const lines=[];
    ALBUM.forEach(sec=>{
      const m=sec.stickers.filter(s=>(data[s.id]||0)===type);
      if(!m.length) return;
      lines.push(sec.name); lines.push(m.map(s=>s.id).join(", ")); lines.push("");
    });
    return lines.join("\n").trimEnd();
  },[data]);

  const TYPES=[
    {key:1,label:"✅ Collected",col:"#4ade80",border:"rgba(74,222,128,.25)",bg:"rgba(74,222,128,.08)"},
    {key:0,label:"❌ Missing",  col:"#fca5a5",border:"rgba(248,113,113,.25)",bg:"rgba(248,113,113,.08)"},
    {key:2,label:"🔄 Duplicates",col:"#fcd34d",border:"rgba(252,211,77,.25)",bg:"rgba(252,211,77,.08)"},
  ];
  const text  = buildText(listType);
  const count = ALBUM.reduce((n,sec)=>n+sec.stickers.filter(s=>(data[s.id]||0)===listType).length,0);
  const lbl   = listType===1?"collected":listType===0?"missing":"duplicates";
  const ct    = TYPES.find(t=>t.key===listType);

  const copy = ()=>navigator.clipboard.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2200);});
  const dlTXT = ()=>{ const b=new Blob([`FIFA WC 2026 — ${username} · ${ct.label}\n${"─".repeat(38)}\n\n`+text],{type:"text/plain"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`${username}_${lbl}.txt`; a.click(); };
  const dlCSV = ()=>{ const rows=["Team,Sticker ID"]; ALBUM.forEach(s=>s.stickers.filter(x=>(data[x.id]||0)===listType).forEach(x=>rows.push(`"${s.name}",${x.id}`))); const b=new Blob([rows.join("\n")],{type:"text/csv"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`${username}_${lbl}.csv`; a.click(); };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center"
      style={{background:"rgba(0,0,0,.75)",backdropFilter:"blur(8px)"}}
      onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="w-full slide-up rounded-t-3xl flex flex-col"
        style={{background:"#0a1828",border:"1px solid rgba(255,255,255,.07)",maxWidth:480,maxHeight:"88vh"}}>

        {/* Header */}
        <div className="flex items-center justify-between px-5 pt-5 pb-3" style={{borderBottom:"1px solid rgba(255,255,255,.06)"}}>
          <div>
            <p className="text-white font-black text-lg leading-none">📤 Export List</p>
            <p style={{fontSize:11,color:"#334155",marginTop:3}}>{username} · {count} stickers</p>
          </div>
          <button onClick={onClose} className="tap w-8 h-8 rounded-full flex items-center justify-center"
            style={{background:"rgba(255,255,255,.06)",color:"#475569"}}>✕</button>
        </div>

        {/* Type selector */}
        <div className="grid grid-cols-3 gap-2 px-4 pt-4">
          {TYPES.map(({key,label,col,border,bg})=>(
            <button key={key} onClick={()=>setListType(key)}
              className="tap rounded-xl py-2.5 text-xs font-black text-center"
              style={{background:listType===key?bg:"rgba(255,255,255,.03)",border:`1.5px solid ${listType===key?col:"rgba(255,255,255,.07)"}`,color:listType===key?col:"#334155",boxShadow:listType===key?`0 0 10px ${col}30`:"none",transition:"all .15s"}}>
              {label}
            </button>
          ))}
        </div>

        {/* Preview */}
        <div className="flex-1 overflow-y-auto mx-4 mt-3 rounded-xl p-3"
          style={{background:"#060e1c",border:"1px solid rgba(255,255,255,.05)",fontFamily:"monospace",fontSize:11,color:"#475569",minHeight:90,maxHeight:260,whiteSpace:"pre-wrap",lineHeight:1.9}}>
          {text || <span style={{color:"#1a2e4a"}}>No stickers in this list yet.</span>}
        </div>

        {/* Actions */}
        <div className="px-4 pt-3 pb-6 grid grid-cols-3 gap-2">
          <button onClick={copy} className="tap rounded-xl py-3 flex flex-col items-center gap-1"
            style={{background:copied?"rgba(74,222,128,.09)":"rgba(255,255,255,.04)",border:`1px solid ${copied?"rgba(74,222,128,.25)":"rgba(255,255,255,.07)"}`}}>
            <span style={{fontSize:22}}>{copied?"✅":"📋"}</span>
            <span style={{fontSize:11,fontWeight:700,color:copied?"#4ade80":"#64748b"}}>{copied?"Copied!":"Copy"}</span>
            <span style={{fontSize:9,color:"#1e3050"}}>WhatsApp / Telegram</span>
          </button>
          <button onClick={dlTXT} className="tap rounded-xl py-3 flex flex-col items-center gap-1"
            style={{background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.07)"}}>
            <span style={{fontSize:22}}>📝</span>
            <span style={{fontSize:11,fontWeight:700,color:"#64748b"}}>TXT</span>
            <span style={{fontSize:9,color:"#1e3050"}}>Text file</span>
          </button>
          <button onClick={dlCSV} className="tap rounded-xl py-3 flex flex-col items-center gap-1"
            style={{background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.07)"}}>
            <span style={{fontSize:22}}>📊</span>
            <span style={{fontSize:11,fontWeight:700,color:"#64748b"}}>CSV</span>
            <span style={{fontSize:9,color:"#1e3050"}}>Spreadsheet</span>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   QUICK ADD MODAL
════════════════════════════════════════════════════════════ */
function QuickAddModal({onAdd, onClose}) {
  const [input,   setInput]   = React.useState("");
  const [state,   setState]   = React.useState(1); // 1=collected, 2=duplicate, 0=missing
  const [result,  setResult]  = React.useState(null); // {ok:[],bad:[]}
  const textareaRef = React.useRef(null);

  React.useEffect(()=>{ setTimeout(()=>textareaRef.current&&textareaRef.current.focus(), 120); },[]);

  const STATES=[
    {key:1, label:"✅ Collected",  col:"#4ade80", border:"rgba(74,222,128,.25)",  bg:"rgba(74,222,128,.08)"},
    {key:2, label:"🔄 Duplicate",  col:"#fcd34d", border:"rgba(252,211,77,.25)",  bg:"rgba(252,211,77,.08)"},
    {key:0, label:"❌ Remove",     col:"#fca5a5", border:"rgba(248,113,113,.25)",  bg:"rgba(248,113,113,.08)"},
  ];
  const cur = STATES.find(s=>s.key===state);

  const handleAdd = () => {
    const ids = input.toUpperCase().match(/[A-Z]+\d+/g) || [];
    const ok=[], bad=[];
    ids.forEach(id => { if(STICKER_MAP[id]) ok.push(id); else bad.push(id); });
    if(!ok.length && !bad.length) return;
    ok.forEach(id => onAdd(id, state));
    setResult({ok, bad});
    setInput("");
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center"
      style={{background:"rgba(0,0,0,.75)",backdropFilter:"blur(8px)"}}
      onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="w-full slide-up rounded-t-3xl flex flex-col"
        style={{background:"#0a1828",border:"1px solid rgba(255,255,255,.07)",maxWidth:480}}>

        {/* Header */}
        <div className="flex items-center justify-between px-5 pt-5 pb-3" style={{borderBottom:"1px solid rgba(255,255,255,.06)"}}>
          <div>
            <p className="text-white font-black text-lg leading-none">➕ Add Stickers</p>
            <p style={{fontSize:11,color:"#334155",marginTop:3}}>Type or paste sticker IDs, then confirm</p>
          </div>
          <button onClick={onClose} className="tap w-8 h-8 rounded-full flex items-center justify-center"
            style={{background:"rgba(255,255,255,.06)",color:"#475569"}}>✕</button>
        </div>

        <div className="px-4 pt-4 pb-6 flex flex-col gap-3">
          {/* State selector */}
          <div className="grid grid-cols-3 gap-2">
            {STATES.map(({key,label,col,border,bg})=>(
              <button key={key} onClick={()=>setState(key)}
                className="tap rounded-xl py-2.5 text-xs font-black text-center"
                style={{background:state===key?bg:"rgba(255,255,255,.03)",border:`1.5px solid ${state===key?col:"rgba(255,255,255,.07)"}`,color:state===key?col:"#334155",boxShadow:state===key?`0 0 10px ${col}30`:"none",transition:"all .15s"}}>
                {label}
              </button>
            ))}
          </div>

          {/* Input */}
          <div>
            <p style={{fontSize:11,color:"#475569",marginBottom:6}}>Enter IDs separated by spaces, commas, or new lines — e.g. <span style={{color:"#C9A84C",fontFamily:"monospace"}}>FWC001 MEX023 ARG010</span></p>
            <textarea ref={textareaRef}
              value={input} onChange={e=>{setInput(e.target.value);setResult(null);}}
              placeholder="FWC001 MEX023 ARG010…"
              rows={4}
              className="w-full rounded-xl p-3 text-sm font-mono"
              style={{background:"#060e1c",border:"1px solid rgba(255,255,255,.09)",color:"#e2e8f0",outline:"none",resize:"none",lineHeight:1.7}}
            />
          </div>

          {/* Result feedback */}
          {result && (
            <div className="rounded-xl p-3 text-xs" style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.06)"}}>
              {result.ok.length>0 && (
                <p style={{color:"#4ade80",marginBottom:result.bad.length?4:0}}>
                  ✅ {result.ok.length} sticker{result.ok.length!==1?"s":""} marked as <strong>{cur.label}</strong>
                </p>
              )}
              {result.bad.length>0 && (
                <p style={{color:"#fca5a5"}}>⚠️ Not found: <span style={{fontFamily:"monospace"}}>{result.bad.join(", ")}</span></p>
              )}
              {result.ok.length===0 && result.bad.length===0 && (
                <p style={{color:"#475569"}}>No valid IDs found. Check the format.</p>
              )}
            </div>
          )}

          {/* Add button */}
          <button onClick={handleAdd}
            className="tap w-full rounded-xl py-3.5 font-black text-sm"
            style={{background:"linear-gradient(135deg,#b8860b,#e6a800,#FFD700)",color:"#071c35",opacity:input.trim()?1:.45,transition:"opacity .15s"}}>
            Mark as {cur.label}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   HOME TAB
════════════════════════════════════════════════════════════ */
function HomeTab({user,owned,dup,missing,pct,filter,setFilter,onSwitchUser,onAddStickers,onGoAlbum}) {
  const r=45, circ=2*Math.PI*r, offset=circ-(pct/100)*circ;
  const next = Math.ceil(pct/5)*5;
  const need = Math.max(0,Math.round((next/100)*TOTAL)-owned-dup);
  const days = need>0?Math.ceil(need/7):0;

/* ════════════════════════════════════════════════════════════
   ALBUM TAB
════════════════════════════════════════════════════════════ */
function AlbumTab({data,cycle,filter,setFilter,search,setSearch,owned,dup,missing,pct}) {
  const secRefs     = React.useRef({});
  const searchUpper = search.trim().toUpperCase();
  const highlightId = searchUpper&&STICKER_MAP[searchUpper]?searchUpper:null;

  React.useEffect(()=>{
    if (highlightId) { secRefs.current[STICKER_MAP[highlightId].si]?.scrollIntoView({behavior:"smooth",block:"start"}); }
    else if (searchUpper) {
      const si=ALBUM.findIndex(s=>s.id===searchUpper||s.name.toUpperCase().includes(searchUpper));
      if(si>=0) secRefs.current[si]?.scrollIntoView({behavior:"smooth",block:"start"});
    }
  },[highlightId,searchUpper]);

  return (
    <div>
      {/* Sticky bar */}
      <div className="sticky top-0 z-20 px-4 pt-3 pb-3"
        style={{background:"rgba(8,16,31,.97)",backdropFilter:"blur(16px)",borderBottom:"1px solid rgba(255,255,255,.06)"}}>
        {/* Filter chips */}
        <div className="grid grid-cols-3 gap-2 mb-2">
          {[
            {key:1,val:owned,  label:"✅ Collected",col:"#4ade80",bg:"rgba(74,222,128,.09)",  border:"rgba(74,222,128,.18)"},
            {key:0,val:missing,label:"❌ Missing",   col:"#fca5a5",bg:"rgba(248,113,113,.09)",border:"rgba(248,113,113,.18)"},
            {key:2,val:dup,    label:"🔄 Duplicates",col:"#fcd34d",bg:"rgba(252,211,77,.09)",  border:"rgba(252,211,77,.18)"},
          ].map(({key,val,label,col,bg,border})=>{
            const active=filter===key;
            return (
              <button key={key} onClick={()=>setFilter(active?null:key)}
                className="tap rounded-xl p-2 text-center sticker-btn"
                style={{background:active?bg:"rgba(255,255,255,.03)",border:`${active?"2px":"1px"} solid ${active?col:border}`,boxShadow:active?`0 0 10px ${col}28`:"none",transform:active?"scale(1.03)":"scale(1)",transition:"all .15s"}}>
                <div className="text-xl font-black" style={{color:col}}>{val}</div>
                <div style={{fontSize:10,fontWeight:700,color:col}}>{label}</div>
              </button>
            );
          })}
        </div>
        {/* Progress */}
        <div className="rounded-full overflow-hidden mb-1" style={{height:5,background:"#0d1f3c"}}>
          <div style={{width:`${pct}%`,height:"100%",background:"linear-gradient(90deg,#C8102E,#C9A84C,#FFD700)",borderRadius:9999,transition:"width .7s"}}/>
        </div>
        <div className="flex items-center justify-center gap-2 mb-2">
          <p style={{fontSize:11,color:"#C9A84C",textAlign:"center"}}>{pct}% · {owned+dup} / {TOTAL}</p>
          {filter!==null&&(
            <button onClick={()=>setFilter(null)} className="tap text-xs font-bold rounded-full px-2 py-0.5 flex items-center gap-1"
              style={{background:"#0d1f3c",color:"#475569",border:"1px solid #1a2e4a"}}>
              {filter===1?"✅":filter===0?"❌":"🔄"} ✕
            </button>
          )}
        </div>
        {/* Search */}
        <div className="relative">
          <div className="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none">
            <Icon name="search" size={14} color="#334155"/>
          </div>
          <input type="text" placeholder="Search sticker — MEX5, ARG1, FWC3…"
            value={search} onChange={e=>setSearch(e.target.value)}
            className="w-full rounded-xl pl-9 pr-4 py-2.5 text-sm font-semibold text-white outline-none"
            style={{background:"rgba(255,255,255,.04)",border:"1.5px solid rgba(255,255,255,.07)",transition:"border-color .2s"}}
            onFocus={e=>e.target.style.borderColor="#C9A84C"}
            onBlur={e=>e.target.style.borderColor="rgba(255,255,255,.07)"}/>
        </div>
      </div>

      {/* Legend */}
      <div className="flex flex-wrap gap-3 justify-center text-xs px-3 py-2" style={{color:"#1e3050"}}>
        <span className="flex items-center gap-1"><span style={{width:12,height:12,borderRadius:3,display:"inline-block",background:"#0d1f3c",border:"1px solid #142540"}}/> Missing</span>
        <span className="flex items-center gap-1"><span style={{width:12,height:12,borderRadius:3,display:"inline-block",background:"#14532d",border:"1px solid #166534"}}/> Owned (1×)</span>
        <span className="flex items-center gap-1"><span style={{width:12,height:12,borderRadius:3,display:"inline-block",background:"#431407",border:"1px solid #7c2d12"}}/> Duplicate (2×)</span>
        <span>⭐ Foil &nbsp; 📸 Photo</span>
      </div>

      {/* Sections */}
      <div className="px-3 pb-10">
        {ALBUM.map((section,si)=>{
          const sStk   = section.stickers;
          const sOwned = sStk.filter(s=>(data[s.id]||0)===1).length;
          const sDup   = sStk.filter(s=>(data[s.id]||0)===2).length;
          const sTotal = sStk.length;
          const done   = sOwned+sDup===sTotal;
          const isSpc  = si===0||si===ALBUM.length-1;
          const fUrl   = section.flagCode?`https://flagcdn.com/w80/${section.flagCode}.png`:null;
          const vis    = filter===null?sStk:sStk.filter(s=>(data[s.id]||0)===filter);
          if(!vis.length) return null;
          return (
            <div key={section.id} ref={el=>secRefs.current[si]=el} className="team-card mb-3">
              <div style={{height:3,background:`linear-gradient(90deg,${section.accent},${section.accent}55,transparent)`}}/>
              <div className="flex items-center justify-between px-3 py-2.5">
                <div className="flex items-center gap-2">
                  {fUrl
                    ?<img src={fUrl} alt={section.name} className="flag-img" onError={e=>{e.target.style.display="none"}}/>
                    :<span className="text-xl">{si===0?"🌐":si===ALBUM.length-1?"🏆":"⚽"}</span>}
                  <div>
                    <span className="font-black text-white text-sm block">{section.name}</span>
                    {!isSpc&&<span style={{fontSize:10,color:"#1e3050"}}>{section.id}1–{section.id}20</span>}
                  </div>
                </div>
                <span className="text-xs font-bold px-2 py-0.5 rounded-full"
                  style={{background:done?"rgba(34,197,94,.1)":"rgba(255,255,255,.04)",border:`1px solid ${done?"rgba(34,197,94,.25)":"rgba(255,255,255,.07)"}`,color:done?"#4ade80":"#334155"}}>
                  {filter===null?`${sOwned+sDup}/${sTotal}${done?" ✅":""}`:vis.length+" shown"}
                </span>
              </div>
              <div className="grid gap-1.5 px-3 pb-3"
                style={{gridTemplateColumns:`repeat(${isSpc?Math.min(vis.length,5):5},1fr)`}}>
                {vis.map(s=>(
                  <StickerBtn key={s.id} sticker={s} state={data[s.id]||0}
                    onCycle={()=>cycle(s.id)} highlight={highlightId===s.id}/>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AppScreen({username, onLogout}) {

  const [data,       setData]       = React.useState({});
  const [loading,    setLoading]    = React.useState(true);
  const [fbError,    setFbError]    = React.useState(false);
  const [syncing,    setSyncing]    = React.useState(false);
  const [filter,     setFilter]     = React.useState(null);
  const [search,     setSearch]     = React.useState("");
  const [activeTab,  setActiveTab]  = React.useState("home");
  const [showExport,    setShowExport]    = React.useState(false);
  const [showQuickAdd,  setShowQuickAdd]  = React.useState(false);
  const [logoutMenu,    setLogoutMenu]    = React.useState(false);
  const dataRef = React.useRef(data);
  React.useEffect(()=>{ dataRef.current=data; },[data]);

  /* Firebase listener */
  React.useEffect(()=>{
    const ref=dbRef(`stickers/${username}`);
    if(!ref){setLoading(false);return;}
    const t=setTimeout(()=>setLoading(false),6000);
    const h=ref.on('value',snap=>{
      clearTimeout(t); setData(snap.val()||{}); setFbError(false); setLoading(false);
    },err=>{ clearTimeout(t); console.error(err); setFbError(true); setLoading(false); });
    return ()=>{ clearTimeout(t); ref.off('value',h); };
  },[username]);

  /* Cycle sticker */
  const cycle=React.useCallback((id)=>{
    const cur=(dataRef.current[id]||0), nxt=(cur+1)%3;
    setData(prev=>{const n={...prev};if(nxt===0)delete n[id];else n[id]=nxt;return n;});
    const ref=dbRef(`stickers/${username}/${id}`);
    if(!ref)return;
    setSyncing(true);
    (nxt===0?ref.remove():ref.set(nxt)).finally(()=>setSyncing(false));
  },[username]);

  /* Set sticker to a specific state (used by QuickAdd) */
  const setSticker=React.useCallback((id,val)=>{
    setData(prev=>{const n={...prev};if(val===0)delete n[id];else n[id]=val;return n;});
    const ref=dbRef(`stickers/${username}/${id}`);
    if(!ref)return;
    setSyncing(true);
    (val===0?ref.remove():ref.set(val)).finally(()=>setSyncing(false));
  },[username]);

  const owned   = Object.values(data).filter(v=>v===1).length;
  const dup     = Object.values(data).filter(v=>v===2).length;
  const missing = TOTAL-owned-dup;
  const pct     = ((owned+dup)/TOTAL*100).toFixed(1);

  /* Loading */
  if(loading) return (
    <div style={{height:"100dvh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#08101f"}}>
      <div style={{fontSize:48,marginBottom:16}}>⚽</div>
      <p className="font-black text-white text-lg mb-3">Loading album…</p>
      <div className="flex gap-1.5">
        {[0,1,2].map(i=>(
          <div key={i} className="w-2 h-2 rounded-full bg-green-400"
            style={{animation:`pulse-dot 1.2s ${i*.2}s ease-in-out infinite`}}/>
        ))}
      </div>
    </div>
  );

  /* DB Error */
  if(fbError) return (
    <div style={{height:"100dvh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 24px",textAlign:"center",background:"#08101f"}}>
      <div style={{fontSize:48,marginBottom:16}}>🔒</div>
      <p className="font-black text-white text-lg mb-2">Database access denied</p>
      <p style={{fontSize:13,color:"#64748b",maxWidth:340,marginBottom:20}}>
        Go to Firebase console → <strong style={{color:"#C9A84C"}}>Realtime Database → Rules</strong> and set read &amp; write to <code style={{color:"#4ade80"}}>true</code>.
      </p>
      <button onClick={()=>window.location.reload()} className="tap font-bold rounded-full px-6 py-3 text-sm text-white"
        style={{background:"linear-gradient(135deg,#003DA5,#0056e0)"}}>Try again</button>
    </div>
  );

  return (
    <div style={{height:"100dvh",overflowY:"auto",overflowX:"hidden",background:"#08101f",maxWidth:480,margin:"0 auto",position:"relative",paddingBottom:112}}
      onClick={()=>{ if(logoutMenu) setLogoutMenu(false); }}>

      <TopNav user={user} syncing={syncing} onLogout={onLogout}
        showLogoutMenu={logoutMenu} setShowLogoutMenu={setLogoutMenu}/>

      {activeTab==="home"&&(
        <HomeTab user={user} owned={owned} dup={dup} missing={missing} pct={pct}
          filter={filter} setFilter={setFilter} onSwitchUser={()=>{ setActiveTab("profile"); }}
          onAddStickers={()=>setShowQuickAdd(true)}
          onGoAlbum={()=>setActiveTab("album")}/>
      )}
      {activeTab==="album"&&(
        <AlbumTab data={data} cycle={cycle} filter={filter} setFilter={setFilter}
          search={search} setSearch={setSearch} owned={owned} dup={dup} missing={missing} pct={pct}/>
      )}
      {activeTab==="swaps"&&(
        <div className="flex flex-col items-center justify-center px-6 py-24 text-center fade-up">
          <span style={{fontSize:48}}>🔄</span>
          <p className="text-white font-black text-lg mt-4 mb-2">Find Swaps</p>
          <p style={{color:"#334155",fontSize:13}}>Coming soon — match duplicates with other collectors.</p>
        </div>
      )}
      {activeTab==="profile"&&(
        <ProfileTab user={user} owned={owned} dup={dup} missing={missing} pct={pct} onLogout={onLogout}/>
      )}

      <BottomNav active={activeTab} setActive={setActiveTab} onExport={()=>setShowExport(true)}/>

      {showExport&&(
        <ExportModal data={data} username={username} onClose={()=>setShowExport(false)}/>
      )}
      {showQuickAdd&&(
        <QuickAddModal onAdd={setSticker} onClose={()=>setShowQuickAdd(false)}/>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   ROOT
════════════════════════════════════════════════════════════ */
function App() {
  const [user, setUser] = React.useState(()=>sessionStorage.getItem(SESSION_KEY)||null);
  const login  = (u) => { sessionStorage.setItem(SESSION_KEY,u); setUser(u); window.scrollTo(0,0); };
  const logout = ()  => { sessionStorage.removeItem(SESSION_KEY); setUser(null); window.scrollTo(0,0); };
  if (!user) return <LoginScreen onLogin={login}/>;
  return <AppScreen username={user} onLogout={logout}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
