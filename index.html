<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071c35" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stickers 2026" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <title>⚽ FIFA World Cup 2026 Stickers</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { background: #071c35; margin: 0; }

    @keyframes shimmer {
      0%   { background-position: -300% center; }
      100% { background-position:  300% center; }
    }
    .gold-text {
      background: linear-gradient(90deg, #a37c28, #FFD700, #ffe066, #FFD700, #a37c28);
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }

    @keyframes float  { 0%,100%{transform:translateY(0) rotate(0deg)}  50%{transform:translateY(-12px) rotate(8deg)} }
    @keyframes float2 { 0%,100%{transform:translateY(0) rotate(0deg)}  50%{transform:translateY(-8px)  rotate(-5deg)} }
    @keyframes float3 { 0%,100%{transform:translateY(0) rotate(0deg)}  50%{transform:translateY(-16px) rotate(12deg)} }
    .ball-float  { animation: float  6s ease-in-out infinite; }
    .ball-float2 { animation: float2 8s ease-in-out infinite; }
    .ball-float3 { animation: float3 9s 2s ease-in-out infinite; }

    @keyframes trophy-glow {
      0%,100% { filter: drop-shadow(0 0 12px #C9A84C88); }
      50%      { filter: drop-shadow(0 0 28px #FFD70099); }
    }
    .trophy-glow { animation: trophy-glow 3s ease-in-out infinite; }

    @keyframes card-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); }
      50%      { box-shadow: 0 0 24px 4px rgba(255,215,0,0.15); }
    }
    .user-card:hover { transform: translateY(-4px) scale(1.02); }
    .user-card       { transition: transform .2s, box-shadow .2s; }

    @keyframes slide-in {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .slide-in { animation: slide-in .35s ease-out both; }

    .pitch-stripes {
      background-image: repeating-linear-gradient(
        0deg, transparent, transparent 44px,
        rgba(255,255,255,0.018) 44px, rgba(255,255,255,0.018) 88px
      );
    }
    .hero-stripe {
      position:absolute; inset:0;
      pointer-events:none;
      background: linear-gradient(135deg,
        transparent 0%, transparent 30%,
        rgba(200,16,46,0.12) 30%, rgba(200,16,46,0.12) 55%,
        transparent 55%);
    }

    .sticker-btn { transition: transform .1s, box-shadow .1s; }
    .sticker-btn:active { transform: scale(.88) !important; }
    .sticker-owned   { background:#16a34a; color:#fff; box-shadow:0 2px 8px #16a34a66; }
    .sticker-dup     { background:#b45309; color:#fff; box-shadow:0 2px 8px #b4530966; }
    .sticker-missing { background:#0f2040; color:#4a6080; border:1px solid #1a3050; }

    .team-card { background:linear-gradient(135deg,#0a1e38,#0d2240); border:1px solid #1a3055; border-radius:16px; overflow:hidden; }
    .flag-img  { width:36px; height:27px; object-fit:cover; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,.5); flex-shrink:0; }

    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:#071c35; }
    ::-webkit-scrollbar-thumb { background:#1a3055; border-radius:3px; }
  </style>
</head>

/* ── HELPERS ─────────────────────────────────────────────────────────── */
function flagUrl(code) {
  return code ? `https://flagcdn.com/w80/${code}.png` : null;
}
function loadStickers(key) {
  try {
    const s = localStorage.getItem(key);
    if (s) return JSON.parse(s);
  } catch {}
  return new Array(TOTAL).fill(0);
}
function userStats(key) {
  const s = loadStickers(key);
  const owned = s.filter(x=>x===1).length;
  const dup   = s.filter(x=>x===2).length;
  return { owned, dup, missing: TOTAL - owned - dup, pct: ((owned+dup)/TOTAL*100).toFixed(1) };
}

/* ── LOGIN SCREEN ────────────────────────────────────────────────────── */

/* ── TRACKER SCREEN ──────────────────────────────────────────────────── */
function TrackerScreen({ username, onSwitchUser }) {
  const user = USERS[username];
  const [stickers, setStickers] = React.useState(() => loadStickers(user.storageKey));
  const [search, setSearch]     = React.useState("");
  const teamRefs = React.useRef({});

  React.useEffect(() => {
    localStorage.setItem(user.storageKey, JSON.stringify(stickers));
  }, [stickers, user.storageKey]);

  const cycle = (idx) => {
    setStickers(prev => { const n=[...prev]; n[idx]=(n[idx]+1)%3; return n; });
  };

  const owned   = stickers.filter(s=>s===1).length;
  const dup     = stickers.filter(s=>s===2).length;
  const missing = TOTAL - owned - dup;
  const pct     = ((owned+dup)/TOTAL*100).toFixed(1);

  const handleSearch = (e) => {
    const val = e.target.value;
    setSearch(val);
    const num = parseInt(val,10);
    if (num>=1 && num<=TOTAL) {
      const ti = Math.floor((num-1)/TEAM_SIZE);
      teamRefs.current[ti]?.scrollIntoView({behavior:"smooth",block:"start"});
    }
  };

  const highlightNum = search ? parseInt(search,10) : null;
  const numTeams = Math.ceil(TOTAL/TEAM_SIZE);

  return (
    <div className="min-h-screen" style={{background:"#071c35"}}>

      {/* ── HERO ─────────────────────────────────────────────────────── */}
      <div className="relative overflow-hidden pitch-stripes"

        </div>
        <div className="absolute" style={{bottom:24,left:12,pointerEvents:"none"}}>
          <div className="ball-float2"><SoccerBall size={44} opacity={0.1}/></div>
        </div>
        <div className="absolute" style={{top:80,left:"42%",pointerEvents:"none"}}>
          <div className="ball-float3"><SoccerBall size={28} opacity={0.07}/></div>
        </div>

        <div style={{height:4,background:"linear-gradient(90deg,#C8102E,#C9A84C,#FFD700,#C9A84C,#C8102E)"}}/>

        <div className="flex flex-col items-center px-4 pt-8 pb-2">
          <div className="flex items-center gap-2 mb-3">
            <div style={{height:1,width:40,background:"linear-gradient(90deg,transparent,#C9A84C)"}}/>
            <span className="text-xs font-bold tracking-widest uppercase" style={{color:"#C9A84C"}}>FIFA World Cup™</span>
            <div style={{height:1,width:40,background:"linear-gradient(90deg,#C9A84C,transparent)"}}/>
          </div>
          <h1 className="gold-text font-black leading-none mb-1" style={{fontSize:"clamp(64px,18vw,96px)",letterSpacing:"-2px"}}>2026</h1>
          <div className="my-2"><TrophySVG/></div>
          <p className="text-white font-black text-base tracking-widest uppercase mb-1" style={{letterSpacing:"0.2em"}}>
            Panini Sticker Album
          </p>

          {/* User badge */}
          <div className="flex items-center gap-2 mb-4 rounded-full px-4 py-1.5"
            style={{background:user.cardBg,border:`1.5px solid ${user.cardBorder}`}}>
            <span className="text-lg">{user.emoji}</span>
            <span className="font-black text-white text-sm tracking-wide">{user.label}'s Tracker</span>
            <button onClick={onSwitchUser}
              className="ml-1 text-xs font-bold rounded-full px-2 py-0.5"
              style={{background:"rgba(0,0,0,0.35)",color:user.accentLight}}>
              Switch ↩
            </button>
          </div>

          {/* Host nations */}
          <div className="flex gap-6 items-center justify-center mb-4">
            {[{code:"us",name:"USA"},{code:"ca",name:"Canada"},{code:"mx",name:"Mexico"}].map(h=>(
              <div key={h.code} className="flex flex-col items-center gap-1">
                <img src={flagUrl(h.code)} alt={h.name}
                  style={{width:52,height:36,borderRadius:6,objectFit:"cover",boxShadow:"0 2px 10px rgba(0,0,0,.6)"}}
                  onError={e=>{e.target.style.display="none"}}/>
                <span className="text-xs font-bold text-gray-300">{h.name}</span>
              </div>
            ))}
          </div>
          <div className="flex items-center gap-2">
            <div style={{height:1,width:28,background:"linear-gradient(90deg,transparent,#4a6080)"}}/>
            <span className="text-xs text-gray-500">Co-hosted by USA · Canada · Mexico</span>
            <div style={{height:1,width:28,background:"linear-gradient(90deg,#4a6080,transparent)"}}/>

        </div>
        <div style={{height:4,background:"linear-gradient(90deg,#C8102E,#C9A84C,#FFD700,#C9A84C,#C8102E)",marginTop:16}}/>
      </div>

      {/* ── STICKY CONTROLS ──────────────────────────────────────────── */}
      <div className="sticky top-0 z-20 px-3 pt-3 pb-3"
        style={{background:"rgba(7,28,53,0.97)",backdropFilter:"blur(12px)",borderBottom:"1px solid #1a3055"}}>

        {/* User indicator strip */}
        <div className="flex items-center justify-between mb-2 rounded-lg px-3 py-1"
          style={{background:user.cardBg,border:`1px solid ${user.cardBorder}`}}>
          <span className="text-xs font-black text-white">{user.emoji} {user.label}'s Album</span>
          <button onClick={onSwitchUser} className="text-xs font-bold rounded-full px-2 py-0.5"
            style={{background:"rgba(0,0,0,0.35)",color:user.accentLight}}>
            Switch user ↩
          </button>
        </div>

        {/* Stats */}
        <div className="grid grid-cols-3 gap-2 mb-3">
          <div className="rounded-xl p-2 text-center"
            style={{background:"linear-gradient(135deg,#0d3a1a,#164d25)",border:"1px solid #1a5c2a"}}>
            <div className="text-2xl font-black" style={{color:"#4ade80"}}>{owned}</div>
            <div className="text-xs font-bold" style={{color:"#86efac"}}>✅ Collected</div>
          </div>
          <div className="rounded-xl p-2 text-center"
            style={{background:"linear-gradient(135deg,#3a0d10,#5a1015)",border:"1px solid #7f1d1d"}}>
            <div className="text-2xl font-black" style={{color:"#fca5a5"}}>{missing}</div>
            <div className="text-xs font-bold" style={{color:"#fca5a5"}}>❌ Missing</div>
          </div>
          <div className="rounded-xl p-2 text-center"
            style={{background:"linear-gradient(135deg,#3a2200,#4d2e00)",border:"1px solid #713f12"}}>
            <div className="text-2xl font-black" style={{color:"#fcd34d"}}>{dup}</div>
            <div className="text-xs font-bold" style={{color:"#fde68a"}}>🔄 Duplicates</div>
          </div>
        </div>

        {/* Progress bar */}
        <div className="relative w-full rounded-full mb-1 overflow-hidden" style={{height:10,background:"#0d2040"}}>
          <div className="h-full rounded-full transition-all duration-700"
            style={{width:`${pct}%`,background:"linear-gradient(90deg,#C8102E,#C9A84C,#FFD700)"}}/>
        </div>
        <p className="text-center text-xs mb-2" style={{color:"#C9A84C"}}>
          {pct}% complete — {owned+dup} / {TOTAL} stickers
        </p>

        {/* Search */}
        <input
          type="number" min="1" max={TOTAL}
          placeholder="🔍  Jump to sticker number (1–980)…"
          value={search}
          onChange={handleSearch}
          className="w-full rounded-xl px-4 py-3 text-base font-semibold text-white placeholder-gray-600 outline-none"
          style={{background:"#0a1e38",border:"2px solid #1a3055",transition:"border-color .2s"}}
          onFocus={e=>e.target.style.borderColor="#C9A84C"}
          onBlur={e=>e.target.style.borderColor="#1a3055"}
        />
      </div>

      {/* ── LEGEND ───────────────────────────────────────────────────── */}
      <div className="flex gap-4 justify-center text-xs px-3 py-2" style={{color:"#4a6080"}}>
        <span className="flex items-center gap-1">
          <span className="w-4 h-4 rounded inline-block" style={{background:"#0f2040",border:"1px solid #1a3050"}}/>Missing
        </span>
        <span className="flex items-center gap-1">
          <span className="w-4 h-4 rounded inline-block bg-green-600"/>Owned (1×)
        </span>
        <span className="flex items-center gap-1">
          <span className="w-4 h-4 rounded inline-block" style={{background:"#b45309"}}/>Duplicate (2×)
        </span>
      </div>

      {/* ── TEAMS ────────────────────────────────────────────────────── */}
      <div className="px-3 pb-10 pt-1">
        {Array.from({length:numTeams},(_,ti)=>{
          const start  = ti*TEAM_SIZE;
          const end    = Math.min(start+TEAM_SIZE,TOTAL);
          const team   = TEAMS[ti]||{name:`Team ${ti+1}`,code:null,accent:"#C9A84C"};
          const slice  = stickers.slice(start,end);
          const tOwned = slice.filter(s=>s===1).length;
          const tDup   = slice.filter(s=>s===2).length;
          const tTotal = end-start;
          const complete = tOwned+tDup===tTotal;
          const fUrl   = flagUrl(team.code);

          return (
            <div key={ti} ref={el=>teamRefs.current[ti]=el} className="team-card mb-4">
              <div style={{height:3,background:`linear-gradient(90deg,${team.accent},${team.accent}88,transparent)`}}/>
              <div className="flex items-center justify-between px-3 py-2">
                <div className="flex items-center gap-2">
                  {fUrl
                    ? <img src={fUrl} alt={team.name} className="flag-img" onError={e=>{e.target.style.display="none"}}/>
                    : <span className="text-2xl">🌍</span>
                  }
                  <span className="font-black text-white text-sm">{team.name}</span>
                </div>
                <span className="text-xs font-bold px-2 py-0.5 rounded-full"
                  style={{background:complete?"#14532d":"#0d2040",border:`1px solid ${complete?"#166534":"#1a3055"}`,color:complete?"#86efac":"#4a6080"}}>
                  {tOwned+tDup}/{tTotal}{complete?" ✅":""}
                </span>
              </div>
              <div className="grid grid-cols-5 gap-1.5 px-3 pb-3 sm:grid-cols-8 md:grid-cols-10">
                {Array.from({length:end-start},(_,i)=>{
                  const idx   = start+i;
                  const num   = idx+1;
                  const state = stickers[idx];
                  const isHl  = highlightNum===num;
                  let cls = "sticker-btn rounded-lg flex flex-col items-center justify-center font-black text-sm select-none cursor-pointer relative ";
                  if      (state===1) cls+="sticker-owned";
                  else if (state===2) cls+="sticker-dup";
                  else                cls+="sticker-missing";
                  return (
                    <button key={idx} onClick={()=>cycle(idx)} className={cls}
                      style={{height:"52px",transform:isHl?"scale(1.12)":undefined,outline:isHl?"3px solid #FFD700":undefined,outlineOffset:isHl?"2px":undefined,zIndex:isHl?10:undefined}}
                      aria-label={`Sticker ${num}`}>
                      <span className="leading-none">{num}</span>
                      {state===2&&(
                        <span className="absolute -top-1.5 -right-1.5 text-white font-black rounded-full flex items-center justify-center"
                          style={{width:20,height:20,background:"#ea580c",fontSize:10}}>×2</span>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {/* ── FOOTER ───────────────────────────────────────────────────── */}
      <div style={{background:"linear-gradient(0deg,#030d1a,#071c35)",borderTop:"1px solid #1a3055",padding:"24px 16px"}}>
        <div className="flex justify-center gap-3 mb-3">
          {["🇺🇸","🇨🇦","🇲🇽"].map(f=><span key={f} className="text-2xl">{f}</span>)}
        </div>
        <p className="text-center text-xs font-bold mb-1" style={{color:"#C9A84C"}}>FIFA World Cup 2026™</p>
        <p className="text-center text-xs mb-3" style={{color:"#2a4060"}}>Made with ⚽ for DARF & SALCAST</p>
        <div className="flex justify-center">
          <button onClick={onSwitchUser}
            className="text-xs font-bold rounded-full px-4 py-2"
            style={{background:user.cardBg,border:`1px solid ${user.cardBorder}`,color:user.accentLight}}>
            {user.emoji} Switch to other album ↩
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── ROOT ────────────────────────────────────────────────────────────── */
function App() {
  const [activeUser, setActiveUser] = React.useState(() => {
    return sessionStorage.getItem(SESSION_KEY) || null;
  });

  const handleSelect = (username) => {
    sessionStorage.setItem(SESSION_KEY, username);
    setActiveUser(username);
    window.scrollTo(0,0);
  };

  const handleSwitch = () => {
    sessionStorage.removeItem(SESSION_KEY);
    setActiveUser(null);
    window.scrollTo(0,0);
  };

  if (!activeUser) return <LoginScreen onSelect={handleSelect}/>;
  return <TrackerScreen username={activeUser} onSwitchUser={handleSwitch}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    });
  }
</script>
</body>
</html>
