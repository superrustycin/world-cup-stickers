<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071c35" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stickers 2026" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <title>⚽ FIFA World Cup 2026 Stickers</title>

  <!-- Firebase Realtime Database (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * { box-sizing: border-box; }
    body { background: #071c35; margin: 0; }

    @keyframes shimmer {
      0%   { background-position: -300% center; }
      100% { background-position:  300% center; }
    }
    .gold-text {
      background: linear-gradient(90deg, #a37c28, #FFD700, #ffe066, #FFD700, #a37c28);
      background-size: 300% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; animation: shimmer 4s linear infinite;
    }

    @keyframes float  { 0%,100%{transform:translateY(0) rotate(0deg)}  50%{transform:translateY(-12px) rotate(8deg)}  }
    @keyframes float2 { 0%,100%{transform:translateY(0) rotate(0deg)}  50%{transform:translateY(-8px)  rotate(-5deg)} }
    @keyframes float3 { 0%,100%{transform:translateY(0) rotate(0deg)}  50%{transform:translateY(-16px) rotate(12deg)} }
    .ball-float  { animation: float  6s  ease-in-out infinite; }
    .ball-float2 { animation: float2 8s  ease-in-out infinite; }
    .ball-float3 { animation: float3 9s 2s ease-in-out infinite; }

    @keyframes trophy-glow {
      0%,100%{ filter:drop-shadow(0 0 12px #C9A84C88); }
      50%    { filter:drop-shadow(0 0 28px #FFD70099); }
    }
    .trophy-glow { animation: trophy-glow 3s ease-in-out infinite; }

    @keyframes slide-in { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    .slide-in { animation: slide-in .35s ease-out both; }

    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }
    .sync-dot { animation: pulse-dot 1.2s ease-in-out infinite; }

    .pitch-stripes {
      background-image: repeating-linear-gradient(
        0deg, transparent, transparent 44px,
        rgba(255,255,255,0.018) 44px, rgba(255,255,255,0.018) 88px);
    }
    .hero-stripe {
      position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(135deg,transparent 30%,rgba(200,16,46,.12) 30% 55%,transparent 55%);
    }

    .sticker-btn { transition:transform .1s, box-shadow .1s; }
    .sticker-btn:active { transform:scale(.88) !important; }
    .s-missing      { background:#0f2040;      color:#4a6080; border:1px solid #1a3050; }
    .s-owned        { background:#16a34a;      color:#fff;    box-shadow:0 2px 8px #16a34a55; }
    .s-dup          { background:#b45309;      color:#fff;    box-shadow:0 2px 8px #b4530955; }
    .s-foil-missing { background:linear-gradient(135deg,#1a1000,#2a1800); color:#C9A84C; border:1px solid #3a2800; }
    .s-foil-owned   { background:linear-gradient(135deg,#14532d,#16a34a); border:1px solid #4ade80; }

    .team-card { background:linear-gradient(135deg,#0a1e38,#0d2240); border:1px solid #1a3055; border-radius:16px; overflow:hidden; }
    .flag-img  { width:36px; height:27px; object-fit:cover; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,.5); flex-shrink:0; }
    .user-card { transition:transform .2s, box-shadow .2s; }
    .user-card:hover { transform:translateY(-4px) scale(1.02); }

    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:#071c35; }
    ::-webkit-scrollbar-thumb { background:#1a3055; border-radius:3px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ═══════════════════════════════════════════════════════════════════
   ALBUM DATA — exact Panini FIFA World Cup 2026 layout
   ═══════════════════════════════════════════════════════════════════ */

  {id:"ENG",name:"England",              flagCode:"gb-eng",accent:"#CF142B"},
  {id:"CRO",name:"Croatia",              flagCode:"hr",    accent:"#FF0000"},
  {id:"GHA",name:"Ghana",                flagCode:"gh",    accent:"#006B3F"},
  {id:"PAN",name:"Panama",               flagCode:"pa",    accent:"#004F9F"},
];

function makeTeamSection(def) {
  return {
    ...def,
    stickers: Array.from({length:20}, (_,i) => ({
      id:    `${def.id}${i+1}`,
      label: i===0  ? "Team Logo"  : i===12 ? "Team Photo" : `Player ${i<12?i:i-1}`,
      type:  i===0  ? "foil"       : i===12 ? "photo"      : "player",
    }))
  };
}

const ALBUM = [INTRO_SECTION, ...TEAM_DEFS.map(makeTeamSection), MUSEUM_SECTION];
const STICKER_MAP = {};
ALBUM.forEach((sec,si) => sec.stickers.forEach(s => { STICKER_MAP[s.id] = {si,sticker:s}; }));
const TOTAL = Object.keys(STICKER_MAP).length; // 980

/* ═══════════════════════════════════════════════════════════════════
   USERS
   ═══════════════════════════════════════════════════════════════════ */
const USERS = {
  DARF: {
    label:"DARF",    emoji:"🔵",
    accent:"#003DA5", accentLight:"#4d8ffc",
    cardBg:"linear-gradient(135deg,#001a4d,#002d80,#003DA5)",
    cardBorder:"#1a4db5",
  },
  SALCAST: {
    label:"SALCAST", emoji:"🔴",
    accent:"#C8102E", accentLight:"#f04060",
    cardBg:"linear-gradient(135deg,#4d0010,#800018,#C8102E)",
    cardBorder:"#b01020",
  },
};
const SESSION_KEY = "wc2026_active_user";

/* ═══════════════════════════════════════════════════════════════════
   FIREBASE HELPERS
   ═══════════════════════════════════════════════════════════════════ */
function calcStats(data) {
  const vals  = Object.values(data);
  const owned = vals.filter(v=>v===1).length;
  const dup   = vals.filter(v=>v===2).length;
  return { owned, dup, missing: TOTAL-owned-dup, pct:((owned+dup)/TOTAL*100).toFixed(1) };
}

/* ═══════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════ */

      <text x="80" y="16" textAnchor="middle" fontSize="14" fill="#FFD700" fontFamily="serif">★ ★ ★ ★ ★</text>
      <circle cx="80" cy="44" r="24" fill="#0d4a7a"/>

      <line x1="80" y1="20" x2="80" y2="68" stroke="#4db8d4" strokeWidth="1.2" opacity="0.7"/>
      <line x1="56" y1="44" x2="104" y2="44" stroke="#4db8d4" strokeWidth="1.2" opacity="0.7"/>
      <ellipse cx="72" cy="36" rx="8" ry="5" fill="#1e7e44" opacity="0.85"/>
      <ellipse cx="90" cy="48" rx="6" ry="4" fill="#1e7e44" opacity="0.85"/>

      <path d="M46 68 Q42 110 46 148 L114 148 Q118 110 114 68 Z" fill="url(#cG)"/>
      <path d="M58 72 Q55 108 58 142 L72 142 Q69 108 66 72 Z" fill="white" opacity="0.15"/>

}

function SoccerBall({size=48, opacity=0.18}) {
  return (
    <svg viewBox="0 0 100 100" style={{width:size,height:size,opacity}}>
      <circle cx="50" cy="50" r="48" fill="white" stroke="#ccc" strokeWidth="1"/>
      <polygon points="50,28 62,38 58,52 42,52 38,38" fill="black"/>
      <polygon points="78,38 90,44 88,58 76,64 66,56 68,42" fill="black"/>
      <polygon points="22,38 10,44 12,58 24,64 34,56 32,42" fill="black"/>
      <polygon points="62,72 72,68 80,76 74,88 60,88 54,78" fill="black"/>
      <polygon points="38,72 28,68 20,76 26,88 40,88 46,78" fill="black"/>

}

/* ═══════════════════════════════════════════════════════════════════
   SETUP SCREEN — shown when Firebase config is not filled in
   ═══════════════════════════════════════════════════════════════════ */
function SetupScreen() {

/* ═══════════════════════════════════════════════════════════════════
   HERO BANNER (shared)
   ═══════════════════════════════════════════════════════════════════ */
function flagUrl(code) { return code ? `https://flagcdn.com/w80/${code}.png` : null; }

        <div className="ball-float2"><SoccerBall size={compact?32:44} opacity={0.1}/></div>

      {!compact && (
        <div className="absolute" style={{top:80,left:"42%",pointerEvents:"none"}}>
          <div className="ball-float3"><SoccerBall size={28} opacity={0.07}/></div>

      <div style={{height:4,background:"linear-gradient(90deg,#C8102E,#C9A84C,#FFD700,#C9A84C,#C8102E)"}}/>

        <div className="flex items-center gap-2 mb-2">
          <div style={{height:1,width:32,background:"linear-gradient(90deg,transparent,#C9A84C)"}}/>

          <div style={{height:1,width:32,background:"linear-gradient(90deg,#C9A84C,transparent)"}}/>
        </div>
        <h1 className="gold-text font-black leading-none mb-1"
          style={{fontSize:compact?"clamp(48px,12vw,72px)":"clamp(64px,18vw,96px)",letterSpacing:"-2px"}}>2026</h1>
        <div className="my-1"><TrophySVG size={compact?72:110}/></div>
        <p className="text-white font-black text-sm tracking-widest uppercase mb-1" style={{letterSpacing:"0.2em"}}>

          <p className="text-sm mb-4" style={{color:"#C9A84C"}}>
            DARF &amp; SALCAST — 980 Stickers · 48 Teams

/* ═══════════════════════════════════════════════════════════════════
   LOGIN SCREEN
   ═══════════════════════════════════════════════════════════════════ */
function LoginScreen({onSelect}) {
  const [stats, setStats] = React.useState({DARF:null, SALCAST:null});

  React.useEffect(() => {
    Object.values(USERS).forEach(user => {
      const ref = dbRef(`stickers/${user.label}`);
      if (!ref) return;
      ref.once('value', snap => {
        setStats(prev => ({...prev, [user.label]: calcStats(snap.val()||{})}));
      });
    });
  }, []);

  return (
    <div className="min-h-screen flex flex-col" style={{background:"#071c35"}}>
      <Hero compact={true}/>
      <div className="flex flex-col items-center flex-1 px-5 py-6 slide-in">
        <p className="text-white font-black text-xl mb-1">Who's collecting today?</p>
        <p className="text-sm mb-2" style={{color:"#4a6080"}}>Pick an album — anyone can contribute!</p>
        {/* Live sync badge */}
        <div className="flex items-center gap-2 mb-6 rounded-full px-3 py-1" style={{background:"#0a2040",border:"1px solid #1a3055"}}>
          <span className="w-2 h-2 rounded-full bg-green-400 sync-dot inline-block"/>
          <span className="text-xs font-semibold" style={{color:"#4ade80"}}>Live sync — changes appear on all devices</span>
        </div>
        <div className="flex flex-col gap-4 w-full max-w-sm">
          {Object.values(USERS).map(user => {
            const s = stats[user.label];
            return (
              <button key={user.label} onClick={()=>onSelect(user.label)}
                className="user-card rounded-2xl p-5 text-left relative overflow-hidden"
                style={{background:user.cardBg,border:`2px solid ${user.cardBorder}`}}>
                <div className="absolute" style={{right:-14,top:-14,opacity:0.1,pointerEvents:"none"}}>
                  <SoccerBall size={80} opacity={1}/>
                </div>
                <div className="flex items-center gap-3 mb-4">
                  <span className="text-4xl">{user.emoji}</span>
                  <div>
                    <p className="text-white font-black text-2xl leading-none">{user.label}</p>
                    <p className="text-xs font-semibold mt-0.5" style={{color:user.accentLight}}>
                      {s ? `${s.pct}% complete · ${s.owned+s.dup} / ${TOTAL}` : "Loading…"}
                    </p>
                  </div>
                  <div className="absolute right-4 top-1/2 -translate-y-1/2 text-2xl font-black" style={{color:user.accentLight}}>›</div>
                </div>
                <div className="grid grid-cols-3 gap-2 mb-3">
                  {s ? [
                    {val:s.owned,   label:"✅ Got",  col:"#86efac"},
                    {val:s.missing, label:"❌ Need",  col:"#fca5a5"},
                    {val:s.dup,     label:"🔄 Swap",  col:"#fde68a"},
                  ].map(({val,label,col})=>(
                    <div key={label} className="rounded-xl py-2 text-center" style={{background:"rgba(0,0,0,0.3)"}}>
                      <div className="text-lg font-black" style={{color:col}}>{val}</div>
                      <div className="text-xs" style={{color:col}}>{label}</div>
                    </div>
                  )) : (
                    <div className="col-span-3 text-center py-2 text-sm" style={{color:"rgba(255,255,255,0.3)"}}>
                      Connecting…
                    </div>
                  )}
                </div>
                {s && (
                  <div className="rounded-full overflow-hidden" style={{height:6,background:"rgba(0,0,0,0.4)"}}>
                    <div className="h-full rounded-full" style={{width:`${s.pct}%`,background:"linear-gradient(90deg,#C8102E,#C9A84C,#FFD700)"}}/>
                  </div>
                )}
              </button>
            );
          })}
        </div>
      </div>
      <div className="text-center text-xs pb-6" style={{color:"#1a3055"}}>
        Made with ⚽ for DARF &amp; SALCAST
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   STICKER BUTTON
   ═══════════════════════════════════════════════════════════════════ */
function StickerBtn({sticker, state, onCycle, highlight}) {
  const isFoil   = sticker.type === "foil";
  const isPhoto  = sticker.type === "photo";
  const isMuseum = sticker.type === "museum";
  let cls = "sticker-btn relative rounded-lg flex flex-col items-center justify-center select-none cursor-pointer ";
  if      (state===1) cls += isFoil ? "s-foil-owned" : "s-owned";
  else if (state===2) cls += "s-dup";
  else                cls += isFoil ? "s-foil-missing" : "s-missing";
  const icon = isFoil ? "⭐" : isPhoto ? "📸" : isMuseum ? "🏆" : null;
  return (
    <button onClick={onCycle} className={cls}
      style={{
        height: isFoil||isMuseum ? "58px" : "52px",
        outline:      highlight ? "3px solid #FFD700" : undefined,
        outlineOffset:highlight ? "2px" : undefined,
        transform:    highlight ? "scale(1.1)" : undefined,
        zIndex:       highlight ? 10 : undefined,
      }}>
      {icon && <span style={{fontSize:10,lineHeight:1,marginBottom:1}}>{icon}</span>}
      <span className="font-black leading-none" style={{fontSize:sticker.id.length>4?9:11}}>{sticker.id}</span>
      {state===2 && (
        <span className="absolute -top-1.5 -right-1.5 text-white font-black rounded-full flex items-center justify-center"
          style={{width:18,height:18,background:"#ea580c",fontSize:9}}>×2</span>
      )}
    </button>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   TRACKER SCREEN
   ═══════════════════════════════════════════════════════════════════ */
function TrackerScreen({username, onSwitchUser}) {
  const user = USERS[username];
  const [data, setData]       = React.useState({});
  const [loading, setLoading] = React.useState(true);
  const [fbError, setFbError] = React.useState(false);
  const [syncing, setSyncing] = React.useState(false);
  const [search, setSearch]   = React.useState("");
  const sectionRefs = React.useRef({});
  const dataRef     = React.useRef(data);
  React.useEffect(() => { dataRef.current = data; }, [data]);

  // Real-time Firebase listener with 6-second timeout fallback
  React.useEffect(() => {
    const ref = dbRef(`stickers/${username}`);
    if (!ref) { setLoading(false); return; }

    // Safety net: always show the app after 6s even if Firebase is slow
    const timeout = setTimeout(() => setLoading(false), 6000);

    const handler = ref.on('value', snap => {
      clearTimeout(timeout);
      setData(snap.val() || {});
      setFbError(false);
      setLoading(false);
    }, (err) => { clearTimeout(timeout); console.error("Firebase error:", err); setFbError(true); setLoading(false); });

    return () => { clearTimeout(timeout); ref.off('value', handler); };
  }, [username]);

  // Cycle sticker: optimistic update + Firebase write
  const cycle = React.useCallback((id) => {
    const current = dataRef.current[id] || 0;
    const next    = (current + 1) % 3;
    // Optimistic
    setData(prev => { const n={...prev}; if(next===0) delete n[id]; else n[id]=next; return n; });
    // Persist
    const ref = dbRef(`stickers/${username}/${id}`);
    if (!ref) return;
    setSyncing(true);
    const op = next===0 ? ref.remove() : ref.set(next);
    op.finally(() => setSyncing(false));
  }, [username]);

  // Search / jump
  const searchUpper = search.trim().toUpperCase();
  const highlightId = searchUpper && STICKER_MAP[searchUpper] ? searchUpper : null;
  React.useEffect(() => {
    if (highlightId) {
      sectionRefs.current[STICKER_MAP[highlightId].si]?.scrollIntoView({behavior:"smooth",block:"start"});
    } else if (searchUpper) {
      const si = ALBUM.findIndex(s=>s.id===searchUpper||s.name.toUpperCase().includes(searchUpper));
      if (si>=0) sectionRefs.current[si]?.scrollIntoView({behavior:"smooth",block:"start"});
    }
  }, [highlightId, searchUpper]);

  const owned   = Object.values(data).filter(v=>v===1).length;
  const dup     = Object.values(data).filter(v=>v===2).length;
  const missing = TOTAL - owned - dup;
  const pct     = ((owned+dup)/TOTAL*100).toFixed(1);

  if (loading) return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6" style={{background:"#071c35"}}>
      <div className="text-5xl mb-4">⚽</div>
      <p className="font-black text-white text-lg mb-2">Connecting to database…</p>
      <div className="flex gap-1 mb-3">
        {[0,1,2].map(i=>(
          <div key={i} className="w-2 h-2 rounded-full bg-green-400"
            style={{animation:`pulse-dot 1.2s ${i*0.2}s ease-in-out infinite`}}/>
        ))}
      </div>
      <p className="text-xs text-center" style={{color:"#4a6080"}}>If this takes more than a few seconds,<br/>check your internet connection.</p>
    </div>
  );

  if (fbError) return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center" style={{background:"#071c35"}}>
      <div className="text-5xl mb-4">🔒</div>
      <p className="font-black text-white text-lg mb-2">Database access denied</p>
      <p className="text-sm mb-5" style={{color:"#94a3b8",maxWidth:380}}>
        Firebase is blocking requests. Go to the Firebase console →<br/>
        <strong style={{color:"#C9A84C"}}>Realtime Database → Rules</strong> and set both <code style={{color:"#4ade80"}}>"read"</code> and <code style={{color:"#4ade80"}}>"write"</code> to <code style={{color:"#4ade80"}}>true</code>.
      </p>
      <button onClick={()=>window.location.reload()}
        className="font-bold rounded-full px-6 py-3 text-sm text-white"
        style={{background:"linear-gradient(135deg,#003DA5,#0056e0)"}}>
        Try again
      </button>
    </div>
  );

  return (
    <div className="min-h-screen" style={{background:"#071c35"}}>
      <Hero compact={false} userBadge={user} onSwitch={onSwitchUser}/>

      {/* ── STICKY BAR ───────────────────────────────────────────── */}
      <div className="sticky top-0 z-20 px-3 pt-3 pb-2"
        style={{background:"rgba(7,28,53,0.97)",backdropFilter:"blur(12px)",borderBottom:"1px solid #1a3055"}}>
        {/* User + sync strip */}
        <div className="flex items-center justify-between rounded-lg px-3 py-1.5 mb-2"
          style={{background:user.cardBg,border:`1px solid ${user.cardBorder}`}}>
          <div className="flex items-center gap-2">
            <span className="text-xs font-black text-white">{user.emoji} {user.label}'s Album</span>
            {syncing && (
              <span className="flex items-center gap-1 text-xs" style={{color:user.accentLight}}>
                <span className="w-1.5 h-1.5 rounded-full inline-block sync-dot" style={{background:user.accentLight}}/>
                saving…
              </span>
            )}
            {!syncing && (
              <span className="flex items-center gap-1 text-xs" style={{color:"#4ade80"}}>
                <span className="w-1.5 h-1.5 rounded-full inline-block bg-green-400"/>
                live
              </span>
            )}
          </div>
          <button onClick={onSwitchUser} className="text-xs font-bold rounded-full px-2 py-0.5"
            style={{background:"rgba(0,0,0,0.35)",color:user.accentLight}}>
            Switch user ↩
          </button>
        </div>
        {/* Stats */}
        <div className="grid grid-cols-3 gap-2 mb-2">
          {[
            {val:owned,   label:"✅ Collected", bg:"linear-gradient(135deg,#0d3a1a,#164d25)", border:"#1a5c2a", col:"#4ade80",  sub:"#86efac"},
            {val:missing, label:"❌ Missing",    bg:"linear-gradient(135deg,#3a0d10,#5a1015)", border:"#7f1d1d", col:"#fca5a5",  sub:"#fca5a5"},
            {val:dup,     label:"🔄 Duplicates", bg:"linear-gradient(135deg,#3a2200,#4d2e00)", border:"#713f12", col:"#fcd34d",  sub:"#fde68a"},
          ].map(({val,label,bg,border,col,sub})=>(
            <div key={label} className="rounded-xl p-2 text-center" style={{background:bg,border:`1px solid ${border}`}}>
              <div className="text-2xl font-black" style={{color:col}}>{val}</div>
              <div className="text-xs font-bold" style={{color:sub}}>{label}</div>
            </div>
          ))}
        </div>
        {/* Progress */}
        <div className="relative w-full rounded-full mb-1 overflow-hidden" style={{height:8,background:"#0d2040"}}>
          <div className="h-full rounded-full transition-all duration-700"
            style={{width:`${pct}%`,background:"linear-gradient(90deg,#C8102E,#C9A84C,#FFD700)"}}/>
        </div>
        <p className="text-center text-xs mb-2" style={{color:"#C9A84C"}}>
          {pct}% · {owned+dup} / {TOTAL} stickers
        </p>
        {/* Search */}
        <input type="text"
          placeholder="🔍  Search sticker code (MEX5, ARG1, FWC3…)"
          value={search} onChange={e=>setSearch(e.target.value)}
          className="w-full rounded-xl px-4 py-3 text-sm font-semibold text-white placeholder-gray-600 outline-none"
          style={{background:"#0a1e38",border:"2px solid #1a3055",transition:"border-color .2s"}}
          onFocus={e=>e.target.style.borderColor="#C9A84C"}
          onBlur={e=>e.target.style.borderColor="#1a3055"}
        />
      </div>

      {/* ── LEGEND ───────────────────────────────────────────────── */}
      <div className="flex flex-wrap gap-3 justify-center text-xs px-3 py-2" style={{color:"#4a6080"}}>
        <span className="flex items-center gap-1"><span className="w-4 h-4 rounded inline-block" style={{background:"#0f2040",border:"1px solid #1a3050"}}/>Missing</span>
        <span className="flex items-center gap-1"><span className="w-4 h-4 rounded bg-green-600 inline-block"/>Owned (1 tap)</span>
        <span className="flex items-center gap-1"><span className="w-4 h-4 rounded inline-block" style={{background:"#b45309"}}/>Duplicate (2 taps)</span>
        <span className="flex items-center gap-1"><span className="text-xs">⭐</span>=Foil</span>
        <span className="flex items-center gap-1"><span className="text-xs">📸</span>=Team Photo</span>
      </div>

      {/* ── SECTIONS ─────────────────────────────────────────────── */}
      <div className="px-3 pb-10 pt-1">
        {ALBUM.map((section,si) => {
          const sStickers = section.stickers;
          const sOwned    = sStickers.filter(s=>(data[s.id]||0)===1).length;
          const sDup      = sStickers.filter(s=>(data[s.id]||0)===2).length;
          const sTotal    = sStickers.length;
          const complete  = sOwned+sDup===sTotal;
          const isSpecial = si===0||si===ALBUM.length-1;
          const fUrl      = flagUrl(section.flagCode);
          return (
            <div key={section.id} ref={el=>sectionRefs.current[si]=el} className="team-card mb-4">
              <div style={{height:3,background:`linear-gradient(90deg,${section.accent},${section.accent}66,transparent)`}}/>
              <div className="flex items-center justify-between px-3 py-2">
                <div className="flex items-center gap-2">
                  {fUrl
                    ? <img src={fUrl} alt={section.name} className="flag-img" onError={e=>{e.target.style.display="none"}}/>
                    : <span className="text-xl">{si===0?"🌐":si===ALBUM.length-1?"🏆":"⚽"}</span>
                  }
                  <div>
                    <span className="font-black text-white text-sm block">{section.name}</span>
                    {!isSpecial && <span className="text-xs" style={{color:"#4a6080"}}>{section.id}1 – {section.id}20</span>}
                  </div>
                </div>
                <span className="text-xs font-bold px-2 py-0.5 rounded-full"
                  style={{background:complete?"#14532d":"#0d2040",border:`1px solid ${complete?"#166534":"#1a3055"}`,color:complete?"#86efac":"#4a6080"}}>
                  {sOwned+sDup}/{sTotal}{complete?" ✅":""}
                </span>
              </div>
              <div className="grid gap-1.5 px-3 pb-3"
                style={{gridTemplateColumns:`repeat(${isSpecial?Math.min(sTotal,5):5},1fr)`}}>
                {sStickers.map(s=>(
                  <StickerBtn key={s.id} sticker={s} state={data[s.id]||0}
                    onCycle={()=>cycle(s.id)} highlight={highlightId===s.id}/>
                ))}
              </div>
            </div>
          );
        })}
      </div>

      {/* ── FOOTER ───────────────────────────────────────────────── */}
      <div style={{background:"linear-gradient(0deg,#030d1a,#071c35)",borderTop:"1px solid #1a3055",padding:"24px 16px"}}>
        <div className="flex justify-center gap-3 mb-3">
          {["🇺🇸","🇨🇦","🇲🇽"].map(f=><span key={f} className="text-2xl">{f}</span>)}
        </div>
        <p className="text-center text-xs font-bold mb-1" style={{color:"#C9A84C"}}>FIFA World Cup 2026™</p>
        <p className="text-center text-xs mb-4" style={{color:"#2a4060"}}>Made with ⚽ for DARF &amp; SALCAST</p>
        <div className="flex justify-center">
          <button onClick={onSwitchUser} className="text-xs font-bold rounded-full px-4 py-2"
            style={{background:user.cardBg,border:`1px solid ${user.cardBorder}`,color:user.accentLight}}>
            {user.emoji} Switch to other album ↩
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   ROOT
   ═══════════════════════════════════════════════════════════════════ */
function App() {
  const [activeUser, setActiveUser] = React.useState(()=>sessionStorage.getItem(SESSION_KEY)||null);
  if (!CONFIG_READY) return <SetupScreen/>;
  const handleSelect = u => { sessionStorage.setItem(SESSION_KEY,u); setActiveUser(u); window.scrollTo(0,0); };
  const handleSwitch = () => { sessionStorage.removeItem(SESSION_KEY); setActiveUser(null); window.scrollTo(0,0); };
  if (!activeUser) return <LoginScreen onSelect={handleSelect}/>;
  return <TrackerScreen username={activeUser} onSwitchUser={handleSwitch}/>;
}
